<div class="page"><div class="page-header"><div><h1>Vehicles</h1><p class="muted">Member 1 fleet management.</p></div><a mat-flat-button color="primary" routerLink="/admin/vehicles/add">Add vehicle</a></div>
@if(error){<p class="error">{{error}}</p>} @if(!vehicles.length&&!error){<div class="card empty">No vehicles found.</div>}
<mat-card class="card table-card"><table mat-table [dataSource]="vehicles">
<ng-container matColumnDef="registrationNumber"><th mat-header-cell *matHeaderCellDef>Registration</th><td mat-cell *matCellDef="let v">{{v.registrationNumber}}</td></ng-container>
<ng-container matColumnDef="vehicleType"><th mat-header-cell *matHeaderCellDef>Type</th><td mat-cell *matCellDef="let v">{{v.vehicleType}}</td></ng-container>
<ng-container matColumnDef="capacityKg"><th mat-header-cell *matHeaderCellDef>Capacity</th><td mat-cell *matCellDef="let v">{{v.capacityKg}} kg</td></ng-container>
<ng-container matColumnDef="status"><th mat-header-cell *matHeaderCellDef>Status</th><td mat-cell *matCellDef="let v"><mat-select [value]="v.status" (selectionChange)="changeStatus(v,$event.value)">@for(s of statuses;track s){<mat-option [value]="s">{{statusName(s)}}</mat-option>}</mat-select></td></ng-container>
<ng-container matColumnDef="actions"><th mat-header-cell *matHeaderCellDef>Actions</th><td mat-cell *matCellDef="let v"><a mat-button [routerLink]="['/admin/vehicles',v.id]">View</a><a mat-button [routerLink]="['/admin/vehicles/edit',v.id]">Edit</a><button mat-button color="warn" (click)="delete(v.id)">Delete</button></td></ng-container>
<tr mat-header-row *matHeaderRowDef="columns"></tr><tr mat-row *matRowDef="let row;columns:columns"></tr></table></mat-card></div>
