<div class="page"><mat-card class="card form-card"><h1>{{editing?'Edit':'Add'}} address</h1>@if(error){<p class="error">{{error}}</p>}
<form [formGroup]="form" (ngSubmit)="submit()"><mat-form-field appearance="outline"><mat-label>Address line 1</mat-label><input matInput formControlName="addressLine1"></mat-form-field>
<mat-form-field appearance="outline"><mat-label>Address line 2</mat-label><input matInput formControlName="addressLine2"></mat-form-field>
<div class="form-grid"><mat-form-field appearance="outline"><mat-label>City</mat-label><input matInput formControlName="city"></mat-form-field><mat-form-field appearance="outline"><mat-label>State</mat-label><input matInput formControlName="state"></mat-form-field>
<mat-form-field appearance="outline"><mat-label>Postal code</mat-label><input matInput formControlName="postalCode"></mat-form-field><mat-form-field appearance="outline"><mat-label>Country</mat-label><input matInput formControlName="country"></mat-form-field></div>
<mat-checkbox formControlName="isDefault">Set as default address</mat-checkbox><div class="actions"><button mat-flat-button color="primary" [disabled]="loading">{{loading?'Saving...':'Save address'}}</button><a mat-button routerLink="/customer/addresses">Cancel</a></div></form></mat-card></div>
