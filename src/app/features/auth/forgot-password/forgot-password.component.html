<div class="auth-page"><mat-card class="auth-card"><h1>Forgot password</h1><p class="muted">Enter your account email.</p>
@if(error){<p class="error">{{error}}</p>} @if(message){<p class="success">{{message}}</p>}
<form [formGroup]="form" (ngSubmit)="submit()"><mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput type="email" formControlName="email"></mat-form-field>
<button mat-flat-button color="primary" [disabled]="loading">{{loading?'Sending...':'Generate reset token'}}</button></form>
@if(resetToken){<div class="token"><strong>Reset token</strong><code>{{resetToken}}</code><small>Use this token on the reset-password page. In production, deliver it through a secure email flow.</small></div>}
<p><a routerLink="/auth/reset-password">Go to reset password</a> · <a routerLink="/auth/login">Back to login</a></p></mat-card></div>
