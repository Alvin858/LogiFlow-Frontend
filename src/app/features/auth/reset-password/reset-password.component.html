<div class="auth-page"><mat-card class="auth-card"><h1>Reset password</h1>@if(error){<p class="error">{{error}}</p>}@if(message){<p class="success">{{message}}</p>}
<form [formGroup]="form" (ngSubmit)="submit()"><mat-form-field appearance="outline"><mat-label>Email</mat-label><input matInput type="email" formControlName="email"></mat-form-field>
<mat-form-field appearance="outline"><mat-label>Reset token</mat-label><textarea matInput rows="3" formControlName="resetToken"></textarea></mat-form-field>
<mat-form-field appearance="outline"><mat-label>New password</mat-label><input matInput type="password" formControlName="newPassword"></mat-form-field>
<button mat-flat-button color="primary" [disabled]="loading">{{loading?'Resetting...':'Reset password'}}</button></form><p><a routerLink="/auth/login">Back to login</a></p></mat-card></div>
