<div class="page"><div class="card form-card"><h1>Change password</h1><p class="muted">Changing your password revokes active refresh tokens on the backend.</p>@if(error){<p class="error">{{error}}</p>}@if(message){<p class="success">{{message}}</p>}
<form [formGroup]="form" (ngSubmit)="submit()"><mat-form-field appearance="outline"><mat-label>Current password</mat-label><input matInput type="password" formControlName="currentPassword"></mat-form-field>
<mat-form-field appearance="outline"><mat-label>New password</mat-label><input matInput type="password" formControlName="newPassword"></mat-form-field>
<div class="actions"><button mat-flat-button color="primary" [disabled]="loading">{{loading?'Saving...':'Change password'}}</button><a mat-button routerLink="/customer/dashboard">Cancel</a></div></form></div></div>
