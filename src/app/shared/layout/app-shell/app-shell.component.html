<mat-toolbar class="toolbar">

  <a class="brand" routerLink="/customer/dashboard">
    LogiFlow
  </a>

  <span class="spacer"></span>

  @if (user?.role === 'Customer') {

    <a
      mat-button
      routerLink="/customer/dashboard"
      routerLinkActive="active">
      Dashboard
    </a>

    <a
      mat-button
      routerLink="/customer/profile"
      routerLinkActive="active">
      Profile
    </a>

    <a
      mat-button
      routerLink="/customer/addresses"
      routerLinkActive="active">
      Addresses
    </a>

    <!-- Module 3 -->
    <a
      mat-button
      routerLink="/routes"
      routerLinkActive="active">
      Routes
    </a>

    <a
      mat-button
      routerLink="/deliveries"
      routerLinkActive="active">
      Deliveries
    </a>

    <a
      mat-button
      routerLink="/schedules"
      routerLinkActive="active">
      Schedules
    </a>
  }

  @if (user?.role === 'Admin' || user?.role === 'Logistics Staff') {

    <a
      mat-button
      routerLink="/admin/vehicles"
      routerLinkActive="active">
      Vehicles
    </a>

    <a
      mat-button
      routerLink="/admin/drivers"
      routerLinkActive="active">
      Drivers
    </a>

    <!-- Module 3 -->
    <a
      mat-button
      routerLink="/routes"
      routerLinkActive="active">
      Routes
    </a>

    <a
      mat-button
      routerLink="/deliveries"
      routerLinkActive="active">
      Deliveries
    </a>

    <a
      mat-button
      routerLink="/schedules"
      routerLinkActive="active">
      Schedules
    </a>
  }

  <button
    mat-button
    [matMenuTriggerFor]="accountMenu">

    {{ user?.firstName }} {{ user?.lastName }}

    <mat-icon>expand_more</mat-icon>

  </button>

</mat-toolbar>


<mat-menu #accountMenu="matMenu">

  <button
    mat-menu-item
    routerLink="/auth/change-password">

    <mat-icon>lock</mat-icon>
    Change password

  </button>

  <button
    mat-menu-item
    (click)="logout()">

    <mat-icon>logout</mat-icon>
    Logout

  </button>

</mat-menu>


<main>
  <router-outlet />
</main>
